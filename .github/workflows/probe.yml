name: Official Shortcuts signing probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sign:
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - name: Generate harmless shortcut and test official signing
        shell: bash
        run: |
          mkdir -p artifact
          python3 - <<'PY'
          import pathlib, plistlib, subprocess, json, hashlib
          root = pathlib.Path('artifact')
          source = root / 'SoporteISP-Prueba-sin-firmar.shortcut'
          target = root / 'SoporteISP-Prueba.shortcut'
          workflow = {
            'WFWorkflowClientVersion': '3036.0.4.2',
            'WFWorkflowMinimumClientVersion': 900,
            'WFWorkflowMinimumClientVersionString': '900',
            'WFWorkflowIcon': {'WFWorkflowIconStartColor': 4282601983, 'WFWorkflowIconGlyphNumber': 61440},
            'WFWorkflowTypes': [],
            'WFWorkflowInputContentItemClasses': [],
            'WFWorkflowImportQuestions': [],
            'WFWorkflowActions': [{
              'WFWorkflowActionIdentifier': 'is.workflow.actions.showalert',
              'WFWorkflowActionParameters': {
                'WFAlertActionTitle': 'SoporteISP: prueba de instalacion',
                'WFAlertActionMessage': 'Atajo de prueba. No envia SMS ni se conecta a SoporteISP.',
                'WFAlertActionCancelButtonShown': False
              }
            }]
          }
          source.write_bytes(plistlib.dumps(workflow, fmt=plistlib.FMT_BINARY))
          report = {'os': subprocess.check_output(['sw_vers'],text=True), 'apple_credentials_supplied': False, 'shortcut_executed': False}
          for name, cmd in [('availability',['/usr/bin/which','shortcuts']), ('help',['/usr/bin/shortcuts','sign','--help']), ('sign',['/usr/bin/shortcuts','sign','--mode','anyone','--input',str(source),'--output',str(target)])]:
            try:
              r = subprocess.run(cmd, capture_output=True, text=True, timeout=150)
              report[name] = {'exit_code':r.returncode, 'stdout':r.stdout, 'stderr':r.stderr}
            except subprocess.TimeoutExpired as e:
              report[name] = {'timeout':True,'seconds':150}
              break
            except OSError as e:
              report[name] = {'error':str(e)}
              break
          if target.exists():
            data = target.read_bytes()
            report['artifact'] = {'size':len(data),'sha256':hashlib.sha256(data).hexdigest(),'magic_hex':data[:4].hex()}
          (root/'report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shortcut-signing-probe
          path: artifact/
          retention-days: 7
